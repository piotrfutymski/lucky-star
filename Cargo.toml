[package]
name = "lucky-star"
version = "0.1.0"
edition = "2024"

[dependencies]
lazy_static = "1.5.0"
ndarray = "0.15.6"
rustronomy-fits = "0.2.0"
rand = "0.10.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }
clap = { version = "4", features = ["derive"] }
vector2d = "3.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"

